
# Rate Limiting Zone (defined outside the server block)
# Limits a single IP to 10 requests/second to help mitigate DDoS.
limit_req_zone \$binary_remote_addr zone=one:10m rate=10r/s;

server {
    listen 80;
    server_name $DOMAIN_OR_IP; 
    root $WEB_ROOT;
    index index.php index.html index.htm;

    # --- SECURITY HEADERS ---
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # --- REVERSE PROXY & PHP MAPPING ---

    # wp-admin loads 20-40 assets simultaneously — exempt it from rate limiting
    # to prevent JS/CSS files being blocked during admin page loads.
    location /wp-admin/ {
        try_files $uri $uri/ /index.php?$args;
    }

    location / {
        # Increased burst from 5 to 20 to accommodate normal page asset loads.
        limit_req zone=one burst=20 nodelay;
        try_files \$uri \$uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # --- BLOCKING SENSITIVE ACCESS ---
    location = /wp-config.php {
        deny all;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }
}

